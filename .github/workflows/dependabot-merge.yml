name: Dependabot Copilot Review & Auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  dependabot-review-and-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Request Copilot review
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

            // Try reviewer assignment first; if unavailable, fall back to a comment trigger.
            const reviewerCandidates = [
              'github-copilot[bot]',
              'copilot-pull-request-reviewer[bot]'
            ];

            let requested = false;
            for (const reviewer of reviewerCandidates) {
              try {
                await github.rest.pulls.requestReviewers({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  reviewers: [reviewer]
                });
                core.notice(`Requested review from ${reviewer}`);
                requested = true;
                break;
              } catch (error) {
                core.warning(`Could not request ${reviewer}: ${error.message}`);
              }
            }

            if (!requested) {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                per_page: 100
              });

              const alreadyRequested = comments.some((comment) =>
                comment.body && comment.body.includes('@copilot review')
              );

              if (!alreadyRequested) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  body: '@copilot review'
                });
                core.notice('Posted @copilot review comment as fallback');
              } else {
                core.notice('Copilot review already requested via comment');
              }
            }

      - name: Enable auto-merge
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Skip auto-merge for major updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          echo "Major dependency update detected. Auto-merge intentionally skipped."
