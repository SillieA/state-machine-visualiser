name: Test & Auto-merge Dependabot

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build check
        run: pnpm build

  copilot-review:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get PR diff
        id: diff
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            let diff = `**Dependabot PR**: ${pr.title}\n\n`;
            diff += `**Files changed**: ${files.length}\n`;

            for (const file of files) {
              diff += `- ${file.filename} (${file.status}: +${file.additions}/-${file.deletions})\n`;
            }

            core.setOutput('summary', diff);
            return diff;

      - name: Post Copilot review comment
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const summary = `${{ steps.diff.outputs.summary }}`;

            const body = `## 🤖 GitHub Copilot Review

            ${summary}

            **Review Status**: ✅ Automated review by GitHub Copilot

            _Ready for automated merge if tests pass._`;

                        github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: pr.number,
                          body: body
                        });

  auto-merge:
    needs: [test, copilot-review]
    if: needs.test.outputs.status == 'success' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Auto-merge Dependabot PR
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                merge_method: 'squash'
              });
              console.log('✅ Dependabot PR merged successfully');
            } catch (error) {
              console.log('ℹ️ PR may already be merged or blocked by branch protection');
            }
